<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Stylized Pine Tree -->
  <polygon points="30,10 40,22 20,22" fill="url(#treeGrad)" />
  <polygon points="30,18 44,32 16,32" fill="url(#treeGrad)" />
  <polygon points="30,28 47,44 13,44" fill="url(#treeGrad)" />
  <rect x="27" y="44" width="6" height="8" rx="1.5" fill="#78350f" />

  <!-- Fire Flame Badge -->
  <g transform="translate(34, 30)">
    <circle cx="15" cy="15" r="14" fill="#090d16" stroke="#f59e0b" stroke-width="1.8" />
    <path d="M15,4 C15,4 19.5,9.5 19.5,14.5 C19.5,17.8 17.5,21.5 15,21.5 C12.5,21.5 10.5,17.8 10.5,14.5 C10.5,9.5 15,4 15,4 Z" fill="url(#flameGrad)" filter="url(#glow)" />
    <path d="M15,11 C15,11 17.5,14.5 17.5,17 C17.5,19 16.3,20.5 15,20.5 C13.7,20.5 12.5,19 12.5,17 C12.5,14.5 15,11 15,11 Z" fill="#fef08a" />
  </g>
</svg>
