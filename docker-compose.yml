services:
  # 1. Web GIS Dashboard & REST API
  web:
    build: .
    container_name: jaga-hutan-web
    restart: unless-stopped
    ports:
      # Hanya dapat diakses lokal; publikasikan melalui Nginx + HTTPS.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /data/jaga_hutan.db
    volumes:
      - jaga-hutan-data:/data
      - ./locations.json:/app/locations.json:ro
    command: python app.py
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Background Hotspot Monitoring Worker
  worker:
    build: .
    container_name: jaga-hutan-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/jaga_hutan.db
    volumes:
      - jaga-hutan-data:/data
      - ./locations.json:/app/locations.json:ro
    command: python main.py --daemon

volumes:
  jaga-hutan-data:
